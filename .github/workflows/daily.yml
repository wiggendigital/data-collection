name: Daily collection

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, early morning in Norway
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest

      # A failed check must not stop the page from being rebuilt: the collector keeps
      # yesterday's files and writes the failure into status.json and runs.json.
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          COLLECTOR_AGENT: "portfolio-data-sample/1.0 (+https://wiggendigital.github.io/data-collection/)"
        run: python -m collector.run

      - name: Save the run
        run: |
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Run of $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Mark the run as failed if a check failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
